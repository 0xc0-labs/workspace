[tools]
jq   = "1.8.2"   # the plugin's hooks (they also need perl, from the OS)
gh   = "2.101.0" # the plugin board loader (board.sh), bootstrap.sh, the commands

[settings]
# Installs only what mise.lock records, every download checked against its
# checksum, for this machine's platform. After any change above, `mise lock`.
locked = true
