[tools]
jq    = "1.8.2"   # the plugin's hooks (they also need perl, from the OS)
gh    = "2.101.0" # the plugin board loader (board.sh), bootstrap.sh, the commands, herdr/bin/autopilot
glow  = "3.0.0"   # herdr-file-viewer's Markdown renderer (herdr/README.md)
delta = "0.20.1"  # herdr-file-viewer's diff renderer
bat   = "0.26.1"  # herdr-file-viewer's source-file renderer

# mise.lock pins every tool here by checksum, and mise checks it on every
# install. No `locked = true` here, unlike in each repo: the workspace's
# settings reach every repo under it, and would refuse the tools of one
# whose own lock is not there yet. After any change above, `mise lock`.
